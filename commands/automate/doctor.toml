description = "Read-only health checks for the Kobiton automate plugin"

prompt = '''
Run read-only health checks for the Kobiton automate plugin. Use your bash tool to run each check below. Print one ✓ (pass) or ✗ (failure) line per check. For each ✗, print an indented remediation hint on the next line prefixed with `→ `. **Never modify any files.** After all 5 checks, print `Summary: <passed>/5 checks passed.`

## Check 1: CLI wrapper installed

The entry point is a symlink to the plugin's `run.sh` on macOS/Linux, or a bash exec-shim (regular file) on Windows.

```bash
LINK="$HOME/.kobiton/bin/kobiton"
if [ -L "$LINK" ]; then
  TARGET="$(readlink "$LINK")"
  if [ -f "$TARGET" ] && [ -x "$TARGET" ]; then
    echo "PASS:$TARGET"
  else
    echo "FAIL:bad-target:$TARGET"
  fi
elif [ -f "$LINK" ] && [ -x "$LINK" ] && grep -q 'run\.sh' "$LINK" 2>/dev/null; then
  echo "PASS:shim:$(grep -o '"[^"]*run\.sh"' "$LINK" | tr -d '"')"
elif [ -e "$LINK" ]; then
  echo "FAIL:not-a-symlink"
else
  echo "FAIL:missing"
fi
```

- `PASS:<target>` → `✓ CLI installed (~/.kobiton/bin/kobiton → <target>)`
- `PASS:shim:<target>` → `✓ CLI installed (~/.kobiton/bin/kobiton is a Windows exec shim → <target>)`
- `FAIL:missing` → `✗ CLI installed (~/.kobiton/bin/kobiton not found)`, remediation: `→ Run /automate:setup to install the wrapper.`
- `FAIL:not-a-symlink` → `✗ CLI installed (~/.kobiton/bin/kobiton is neither a symlink nor an exec shim)`, same remediation
- `FAIL:bad-target:<t>` → `✗ CLI installed (symlink target missing or not executable: <t>)`, same remediation

## Check 2: Credentials file

```bash
F="$HOME/.kobiton/.credentials"
if [ -f "$F" ] && [ ! -L "$F" ]; then
  MODE=$(stat -c '%a' "$F" 2>/dev/null || stat -f '%A' "$F" 2>/dev/null)
  if [ "$MODE" = "600" ]; then echo "PASS"; else echo "PASS:mode=$MODE"; fi
elif [ -L "$F" ]; then echo "FAIL:symlink"
elif [ -d "$F" ]; then echo "FAIL:directory"
else echo "FAIL:missing"
fi
```

- `PASS` → `✓ Credentials file`
- `PASS:mode=<m>` → `✓ Credentials file (mode is <m>, expected 600)` (still counts as pass; informational)
- `FAIL:missing` → `✗ Credentials file`, remediation: `→ ~/.kobiton/.credentials does not exist. Run /automate:setup to create it.`
- `FAIL:symlink` → `✗ Credentials file (is a symlink)`, remediation: `→ Replace ~/.kobiton/.credentials with a regular file. Run /automate:setup.`
- `FAIL:directory` → `✗ Credentials file (is a directory)`, remediation: `→ Remove the directory at ~/.kobiton/.credentials and run /automate:setup.`

## Check 3: Active profile present

```bash
F="$HOME/.kobiton/.credentials"
PROFILE="${KOBITON_PROFILE:-default}"
if [ ! -f "$F" ]; then echo "SKIP"; exit 0; fi
PROFILE="$PROFILE" awk '
  BEGIN { found = 0 }
  /^[[:space:]]*\[[[:space:]]*[^]]+[[:space:]]*\]/ {
    n = $0; sub(/^[[:space:]]*\[[[:space:]]*/, "", n); sub(/[[:space:]]*\][[:space:]]*$/, "", n)
    if (n == ENVIRON["PROFILE"]) { found = 1; exit 0 }
  }
  END { print (found ? "PASS" : "FAIL") }
' "$F"
```

- `SKIP` → `- Active profile (skipped — credentials file missing)`, do not count as pass or fail.
- `PASS` → `✓ Active profile [<PROFILE>]`
- `FAIL` → `✗ Active profile [<PROFILE>]`, remediation: `→ Profile [<PROFILE>] not found in ~/.kobiton/.credentials. Run /automate:setup to create it, or unset KOBITON_PROFILE to use [default].`

## Check 4: Required fields populated

```bash
F="$HOME/.kobiton/.credentials"
PROFILE="${KOBITON_PROFILE:-default}"
if [ ! -f "$F" ]; then echo "SKIP"; exit 0; fi
PROFILE="$PROFILE" awk '
  function trim(s) { sub(/^[[:space:]]+/, "", s); sub(/[[:space:]]+$/, "", s); return s }
  BEGIN { found=0; in_p=0 }
  /^[[:space:]]*\[[[:space:]]*[^]]+[[:space:]]*\]/ {
    n = $0; sub(/^[[:space:]]*\[[[:space:]]*/, "", n); sub(/[[:space:]]*\][[:space:]]*$/, "", n)
    if (n == ENVIRON["PROFILE"]) { in_p = 1; found = 1 } else { if (in_p) exit 0; in_p = 0 }
    next
  }
  in_p && /=/ {
    k = trim(substr($0, 1, index($0,"=")-1))
    v = trim(substr($0, index($0,"=")+1))
    if (v != "") seen[k] = 1
  }
  END {
    if (!found) { print "MISSING_PROFILE"; exit 0 }
    miss = ""
    split("KOBITON_USER KOBITON_API_KEY KOBITON_PORTAL", reqs, " ")
    for (i in reqs) if (!(reqs[i] in seen)) miss = miss " " reqs[i]
    if (miss == "") print "PASS"; else print "FAIL:" miss
  }
' "$F"
```

- `SKIP` / `MISSING_PROFILE` → `- Required fields (skipped — earlier check failed)`, do not count.
- `PASS` → `✓ Required fields (KOBITON_USER, KOBITON_API_KEY, KOBITON_PORTAL)`
- `FAIL:<missing>` → `✗ Required fields (missing:<missing>)`, remediation: `→ Run /automate:setup to refresh, or edit ~/.kobiton/.credentials.`

## Check 5: CLI version (pinned vs installed vs latest)

Reports version drift between the plugin's pin, the cached binary, and the newest published build — and whether the pinned build is still downloadable. HEAD-only requests; nothing is downloaded.

```bash
PIN="$(tr -d '[:space:]' < "$HOME/.gemini/extensions/kobiton-automate/skills/run-interactive-session/CLI_VERSION" 2>/dev/null)"
INSTALLED="$("$HOME/.kobiton/bin/kobiton" --version 2>/dev/null | awk '{print $2}')"
LATEST="$(curl -sI --connect-timeout 5 --max-time 15 "https://public.kobiton.download/kobiton-cli/latest/" 2>/dev/null | awk 'tolower($1)=="location:"{print $2}' | tr -d '\r' | sed -e 's|/$||' -e 's|.*/||')"
PIN_ON_SERVER="unknown"
if [ -n "$PIN" ] && [ -n "$LATEST" ]; then
  CODE="$(curl -s -o /dev/null -I -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://public.kobiton.download/kobiton-cli/$PIN/" 2>/dev/null)"
  case "$CODE" in 200) PIN_ON_SERVER="yes";; 404) PIN_ON_SERVER="pruned";; *) PIN_ON_SERVER="unknown";; esac
fi
echo "pin=$PIN"; echo "installed=$INSTALLED"; echo "latest=$LATEST"; echo "pin_on_server=$PIN_ON_SERVER"
```

Interpret:

- `pin` empty → `✗ CLI version (no CLI_VERSION pin found in the plugin)`, remediation: `→ Re-install the plugin; the pin file ships with it.`
- `installed` empty → `✗ CLI version (no installed CLI to compare — see Check 1)`, remediation: `→ Run /automate:setup to download the pinned build.`
- `latest` empty (network unreachable) → `- CLI version (skipped — download server unreachable; pinned <pin>, installed <installed>)`, do not count as pass or fail.
- `installed == pin` → `✓ CLI version (pinned <pin> = installed; latest available <latest>)`. If `pin_on_server=pruned`, append: `→ Note: the pinned build is no longer downloadable upstream. Existing installs keep working from cache; fresh installs fall back to the newest build. Update the automate plugin to its latest version to refresh the pin.`
- `installed != pin` → `✗ CLI version (installed <installed> ≠ pinned <pin>; latest available <latest>)`, remediation: `→ The cache serves a different build than this plugin release was validated against. Run /automate:setup to re-download the pin if pin_on_server=yes; otherwise update the automate plugin to its latest version - newer releases pin a validated build.`

`latest` differing from `pin` is normal — informational only, never a failure by itself.

## Summary

Count:
- `passed` = number of `✓` lines across Checks 1–5
- Skipped checks (printed with `-`) do not count as passed or failed

Print exactly:

```
Summary: <passed>/5 checks passed.
```

If `passed < 5`, append: `Fix the issues above and rerun /automate:doctor.`
If `passed == 5`, append: `All checks passed. You're ready to use the plugin.`
'''
