domain: DEVICE
tools:
  - name: listDevices
    title: List Devices
    description: >
      List available devices filtered by platform, availability status, or
      device group. Returns device name, UDID, platform, OS version, and
      availability. Devices with is_cloud: true (the cloud_devices list, and
      flagged rows in favorite_devices) have restricted shell-command access
      in CLI sessions; is_cloud: false devices are unrestricted. When no
      device matches, the response includes applied_filters echoing the
      interpreted filter values, so an empty device list can be told apart
      from a filter that matched nothing. With virtualUsb: true the result
      is private devices only, each carrying virtual_usb_ready (and
      virtual_usb_reason when false), and applied_filters is always present
      with virtualUsb: true, even for a non-empty list. virtualUsb: true
      requires deviceGroup PRIVATE or omitted; CLOUD and ALL are rejected.
      virtual_usb_ready reflects the host machine's virtualUSB configuration,
      not current availability; check is_online and is_booked for that.
      Organization admins can call listHostingMachines with the same udid to
      see the virtualUSB status of that device's host machine.
    annotations:
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false
    inputSchema:
      type: object
      properties:
        userIntent:
          type: string
          description: >-
            A brief summary of what the user is trying to accomplish with this
            tool call, refined from their original prompt. Used for audit
            logging.
        platform:
          type: string
          enum:
            - ANDROID
            - IOS
          description: Filter by device platform
        available:
          type: boolean
          description: Only show currently available devices
          default: true
        deviceGroup:
          type: string
          enum:
            - PRIVATE
            - CLOUD
            - ALL
          description: Filter by device group
          default: PRIVATE
        deviceName:
          type: string
          description: >-
            Filter by device name, matched case-insensitively against the full
            name. Use `*` wildcards for partial matching: "*galaxy*" matches
            "Galaxy S22+" and "Galaxy Tab S8"; "Galaxy*" matches names starting
            with "Galaxy". A bare value without wildcards only matches the
            exact full name.
        udid:
          type: string
          description: Filter by exact device UDID
        groupId:
          type: integer
          description: Filter by device group ID
        virtualUsb:
          type: boolean
          description: >-
            When true, list only private devices whose host machine can
            serve virtualUSB: adds `virtual_usb_ready` per device, returns
            ready devices only unless `udid` is given (then the device is
            returned flagged, with `virtual_usb_reason` when not ready), and
            always echoes `applied_filters` including `virtualUsb: true`.
            `deviceGroup` must be PRIVATE or omitted. Organization admins can
            call `listHostingMachines` with the same `udid` to see the
            virtualUSB status of that device's host machine.
        limit:
          type: integer
          description: Maximum number of devices to return (max 20)
          default: 5
      required:
        - userIntent
  - name: listHostingMachines
    title: List Hosting Machines
    description: >
      List the organization's host machines (the machines private devices are
      attached to) with their virtualUSB configuration. Organization admins
      only; other users get the server's permission error unchanged. Each machine carries id, host_name (null for Kobiton-hosted
      machines), host_type, virtual_usb (enabled, network_routing,
      ip_address_configured, provisioning_status) and virtual_usb_status
      (state, message, next_step). virtual_usb_status.state is one of
      DISABLED, NO_NETWORK_ROUTE, ROUTING_PROVISIONING,
      ROUTING_PROVISIONING_FAILED or CONFIGURED; relay message and next_step
      to the user. The response also carries a top-level sku_active and, when
      the organization lacks the virtualUSB add-on, a sku_note to relay
      instead. With udid, only the host machine of that private device is
      returned; when the device or its host machine is not visible to the
      caller, machines is empty and reason explains why. A udid lookup also
      adds device (udid, state, is_online) to the machine; when that device
      is UNPLUGGED there, the machine is only its last known host, reason
      says so, and virtualUSB cannot reach the device through it - do not
      configure that machine for the device. With machineId,
      only that host machine is returned. applied_filters echoes the
      interpreted filters, including afterId and machineId when given. IP
      addresses are never returned. Each machine also carries
      max_parallel_tests (mode, limit). Machines are returned in ascending id
      order, at most limit (max 50) per call; the response carries
      total_machines (all matching machines) and next_after_id (pass it as
      afterId for the next page; null when there are no more). Admins can
      change a machine's settings with configureHostingMachine.
    annotations:
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false
    inputSchema:
      type: object
      properties:
        userIntent:
          type: string
          description: >-
            A brief summary of what the user is trying to accomplish with this
            tool call, refined from their original prompt. Used for audit
            logging.
        udid:
          type: string
          maxLength: 255
          description: >-
            Return only the host machine of this private device (for example
            one listDevices reported with `virtual_usb_ready: false`).
        machineId:
          type: integer
          minimum: 1
          description: >-
            Return only this host machine (the id from a previous
            listHostingMachines result); combinable with udid.
        afterId:
          type: integer
          minimum: 1
          description: >-
            Return only machines whose id is greater than this; pass the
            previous page's next_after_id to get the next page.
        limit:
          type: integer
          description: Maximum number of machines to return (max 50)
          default: 20
      required:
        - userIntent
  - name: configureHostingMachine
    title: Configure Hosting Machine
    description: >
      Change the virtualUSB settings and/or the max parallel tests setting of
      one host machine. Organization admins only; other users get the
      server's permission error unchanged. machineId is the id from
      listHostingMachines. Pass at least one of virtualUsb and
      maxParallelTests; both sections are applied together in one save.
      virtualUSB settings need the organization's virtualUSB add-on.
      virtualUsb.enabled true needs networkRouting: KOBITON for
      Kobiton-managed routing, or SELF_MANAGED with the machine's ipAddress;
      virtualUsb.enabled false takes no routing and no address. Max parallel
      tests caps how many of the machine's devices can be in use at the same
      time: mode UNLIMITED, or CUSTOM with a limit. A request that matches the
      current configuration changes nothing and returns changed false.
      Returns changed and machine, in the same shape as listHostingMachines
      (virtual_usb, virtual_usb_status with state, message and next_step, and
      max_parallel_tests), plus sku_active and, when the organization lacks
      the add-on, sku_note. IP addresses are never returned. Session
      behaviour is the same as in the Kobiton portal: turning virtualUSB off
      on, or moving off Kobiton-managed routing from, a machine that uses
      Kobiton-managed routing ends the active virtualUSB sessions on its
      devices; turning virtualUSB off on a self-managed machine does not
      currently disconnect clients that are already connected; entering
      Kobiton-managed routing starts provisioning (state
      ROUTING_PROVISIONING), so check again with listHostingMachines. Confirm
      the exact change with the user before calling this tool, and say which
      sessions may end.
    annotations:
      readOnlyHint: false
      destructiveHint: true
      idempotentHint: true
      openWorldHint: false
    inputSchema:
      type: object
      properties:
        userIntent:
          type: string
          description: >-
            A brief summary of what the user is trying to accomplish with this
            tool call, refined from their original prompt. Used for audit
            logging.
        machineId:
          type: integer
          minimum: 1
          description: >-
            The host machine to configure: the `id` of a machine returned by
            listHostingMachines.
        virtualUsb:
          type: object
          description: >-
            The machine's virtualUSB settings. Omit to leave them unchanged.
          properties:
            enabled:
              type: boolean
              description: Turn virtualUSB on (true) or off (false).
            networkRouting:
              type: string
              enum:
                - KOBITON
                - SELF_MANAGED
              description: >-
                KOBITON for Kobiton-managed routing; SELF_MANAGED to route to
                the machine's own reachable address given in `ipAddress`.
                Required when `enabled` is true; not allowed when false.
            ipAddress:
              type: string
              maxLength: 45
              description: >-
                The host machine's reachable IP address. Required with
                `networkRouting: SELF_MANAGED`; not allowed with KOBITON or
                when `enabled` is false.
          required:
            - enabled
          additionalProperties: false
        maxParallelTests:
          type: object
          description: >-
            How many of the machine's devices can be in use at the same time.
            Omit to leave it unchanged.
          properties:
            mode:
              type: string
              enum:
                - UNLIMITED
                - CUSTOM
              description: UNLIMITED for no cap; CUSTOM to cap at `limit`.
            limit:
              type: integer
              minimum: 1
              maximum: 999
              description: >-
                The cap on devices in use at the same time. Required with
                `mode: CUSTOM`; not allowed with UNLIMITED.
          required:
            - mode
          additionalProperties: false
      required:
        - userIntent
        - machineId
  - name: getDeviceStatus
    title: Get Device Status
    description: >
      Get the real-time availability status of a specific device (e.g.
      `is_booked`, `is_online`) and `deviceId`.
    annotations:
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false
    inputSchema:
      type: object
      properties:
        userIntent:
          type: string
          description: >-
            A brief summary of what the user is trying to accomplish with this
            tool call, refined from their original prompt. Used for audit
            logging.
        deviceId:
          type: integer
          description: The device ID
      required:
        - userIntent
        - deviceId
  - name: reserveDevice
    title: Reserve Device
    description: >
      Reserve a device for exclusive use during testing. The reservation
      prevents other users from starting sessions on the device. Use the device
      UDID from listDevices. Returns reservation_id which is needed for
      terminateReservation.
    annotations:
      readOnlyHint: false
      destructiveHint: false
      idempotentHint: false
      openWorldHint: false
    inputSchema:
      type: object
      properties:
        userIntent:
          type: string
          description: >-
            A brief summary of what the user is trying to accomplish with this
            tool call, refined from their original prompt. Used for audit
            logging.
        udid:
          type: string
          description: The device UDID to reserve (from listDevices)
        durationMinutes:
          type: integer
          description: Reservation duration in minutes
          default: 30
      required:
        - userIntent
        - udid
  - name: terminateReservation
    title: Terminate Reservation
    description: >
      Release a reserved device by terminating its reservation. Use the
      reservation_id returned by reserveDevice or from listDevices
      (reservation_id field on reserved devices).
    annotations:
      readOnlyHint: false
      destructiveHint: true
      idempotentHint: true
      openWorldHint: false
    inputSchema:
      type: object
      properties:
        userIntent:
          type: string
          description: >-
            A brief summary of what the user is trying to accomplish with this
            tool call, refined from their original prompt. Used for audit
            logging.
        reservationId:
          type: integer
          description: Reservation ID from reserveDevice or listDevices
      required:
        - userIntent
        - reservationId
