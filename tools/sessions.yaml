domain: SESSION
tools:
  - name: listSessions
    title: List Sessions
    description: >
      List test sessions with filters for status, device, platform, and date
      range. Returns session ID, status, device info, duration, and timestamps.
    annotations:
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false
    inputSchema:
      type: object
      properties:
        userIntent:
          type: string
          description: >-
            A brief summary of what the user is trying to accomplish with this
            tool call, refined from their original prompt. Used for audit
            logging.
        state:
          type: string
          enum:
            - START
            - COMPLETE
            - PASSED
            - FAILED
            - TIMEOUT
            - ERROR
            - TERMINATED
          description: Filter by session state
        deviceId:
          type: integer
          description: >-
            Filter by Kobiton device ID (numeric ID returned by listDevices)
        deviceName:
          type: string
          description: Filter by device name (partial match)
        keyword:
          type: string
          description: >-
            Search across session name, device name, model, UDID, or platform
            version
        platform:
          type: string
          enum:
            - ANDROID
            - IOS
          description: Filter by platform
        limit:
          type: integer
          description: Maximum number of sessions to return
          default: 10
        offset:
          type: integer
          description: Offset for pagination
          default: 0
      required:
        - userIntent
  - name: getSession
    title: Get Session
    description: >
      Get detailed information about a specific test session including commands
      executed, device info, desired capabilities, metadata, and test results.
      `video_url` may be null; there is no separate `has_video` indicator.
    annotations:
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false
    inputSchema:
      type: object
      properties:
        userIntent:
          type: string
          description: >-
            A brief summary of what the user is trying to accomplish with this
            tool call, refined from their original prompt. Used for audit
            logging.
        sessionId:
          type: integer
          description: The session ID
      required:
        - userIntent
        - sessionId
  - name: getSessionArtifacts
    title: Get Session Artifacts
    description: >
      Get download URLs for session artifacts including video recording, device
      logs, and test reports.
    annotations:
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false
    inputSchema:
      type: object
      properties:
        userIntent:
          type: string
          description: >-
            A brief summary of what the user is trying to accomplish with this
            tool call, refined from their original prompt. Used for audit
            logging.
        sessionId:
          type: integer
          description: The session ID
      required:
        - userIntent
        - sessionId
  - name: getUserInputEvents
    title: Get User Input Events
    description: >
      Return the touch and swipe gestures the human watching the device-only live
      view has made on the device canvas since a given timestamp, oldest first.
      Poll this between your scripted commands so the user can redirect you mid-run
      — e.g. if they tap Settings, pivot your test plan to focus on Settings. The
      user's tap also reaches the device in real time, so by the time you read
      these gestures the device has already moved; treat them as facts about what
      the human just did, not as actions to perform.
    annotations:
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false
    inputSchema:
      type: object
      properties:
        userIntent:
          type: string
          description: >-
            A brief summary of what the user is trying to accomplish with this
            tool call, refined from their original prompt. Used for audit
            logging.
        sessionId:
          type: integer
          description: The session ID
        sinceTimestamp:
          type: integer
          description: >-
            Epoch milliseconds. Return only events newer than this. Pass the
            timestamp of the last event you saw to page forward; omit to get all
            currently buffered events.
        limit:
          type: integer
          description: >-
            Maximum number of events to return (default 50, max 200). Useful on
            the first poll against a session where the human has been
            interacting before you started — pages forward by re-calling with
            the newest seen timestamp as sinceTimestamp.
          default: 50
      required:
        - userIntent
        - sessionId
  - name: terminateSession
    title: Terminate Session
    description: >
      Terminate a running test session. Use when a session needs to be stopped
      before it completes naturally.
    annotations:
      readOnlyHint: false
      destructiveHint: true
      idempotentHint: true
      openWorldHint: false
    inputSchema:
      type: object
      properties:
        userIntent:
          type: string
          description: >-
            A brief summary of what the user is trying to accomplish with this
            tool call, refined from their original prompt. Used for audit
            logging.
        sessionId:
          type: integer
          description: Session ID to terminate
      required:
        - userIntent
        - sessionId
  - name: startNativeSession
    title: Start Native Session
    description: >
      Start a native automation session on a Kobiton device using a native test
      framework — XCUITest (iOS), UIAutomator (Android), or GameDriver. Upload
      the app under test and the test-runner bundle to Kobiton Store first
      (uploadAppToStore) and pass their kobiton-store identifiers as `app` and
      `testRunner`. Returns the created session ID plus the booked device UDID
      and a test-report download URL. This starts a real, billable device
      session — prefer listDevices first to confirm a matching device is
      available.
    annotations:
      readOnlyHint: false
      destructiveHint: false
      idempotentHint: false
      openWorldHint: false
    inputSchema:
      type: object
      properties:
        userIntent:
          type: string
          description: >-
            A brief summary of what the user is trying to accomplish with this
            tool call, refined from their original prompt. Used for audit
            logging.
        testFramework:
          type: string
          enum:
            - XCUITEST
            - UIAUTOMATOR
            - GAMEDRIVER
          description: >-
            Native test framework to run. Exact upper-case values required.
            XCUITEST is iOS-only; UIAUTOMATOR is Android-only.
        sessionName:
          type: string
          description: Optional name for the session
        sessionDescription:
          type: string
          description: Optional description for the session
        deviceName:
          type: string
          description: >-
            Device name to match (e.g. "Galaxy S21"). Ignored when `udid` is
            given.
        udid:
          type: string
          description: >-
            Exact device UDID to run on. Takes precedence over deviceName /
            platformVersion matching.
        platformVersion:
          type: string
          description: OS version to match (e.g. "14", "17.4")
        deviceGroup:
          type: string
          enum:
            - KOBITON
            - ORGANIZATION
            - ANY
          description: >-
            Which device pool to book from. KOBITON = Kobiton public cloud
            devices, ORGANIZATION = your organization's own private devices,
            ANY = search both pools. Defaults to ANY when omitted.
        groupId:
          type: integer
          description: Team ID to run the session under
        app:
          type: string
          description: >-
            App under test, as a kobiton-store:<appId> identifier returned by
            uploadAppToStore. Required for XCUITEST and UIAUTOMATOR — the
            server rejects the call when omitted.
        testRunner:
          type: string
          description: >-
            Test runner bundle (XCUITest test-runner .ipa, UIAutomator test
            .apk, or GameDriver runner), as a kobiton-store:<appId> identifier.
            Required for XCUITEST and UIAUTOMATOR — the server rejects the
            call when omitted.
        noReset:
          type: boolean
          description: >-
            Keep app data between runs (do not reset the app). Mutually
            exclusive with fullReset — set at most one of the two.
        fullReset:
          type: boolean
          description: >-
            Uninstall and reinstall the app before the run. Mutually exclusive
            with noReset — set at most one of the two.
        sessionTimeout:
          type: integer
          description: Maximum session duration in minutes (default 60)
        testTimeout:
          type: integer
          description: Maximum test execution time in minutes
        deviceTags:
          type: array
          description: Only book devices carrying all of these device tags
          items:
            type: string
        deviceWaitTimeout:
          type: integer
          description: >-
            How long (in seconds, 1-86400) to wait for a matching device to
            become available before failing. Only honored for queued
            executions.
        runCommand:
          type: string
          description: >-
            GameDriver only — command line used to launch the runner. Ignored
            for XCUITEST and UIAUTOMATOR.
        args:
          type: array
          description: Extra arguments passed to the test runner
          items:
            type: string
        env:
          type: object
          description: Environment variables to set for the test runner process
          additionalProperties:
            type: string
      required:
        - userIntent
        - testFramework
