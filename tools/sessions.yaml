  - name: listFlexCorrects
    title: List Flex Corrects
    description: >
      List the steps Flex Correct self-healed during a test session — the corrected
      element, the baseline device the step was recorded on, and the recorded step.
      Reach for this when the user asks "what was auto-corrected", "self-healed
      steps" or "flex correct" for a session.
      Results are paged: each call returns at most `limit` items (default 10,
      max 20) plus `page`, `total_pages` and `total_items`; pass `offset` to
      page forward. A session with no findings of this type returns
      `total_items: 0` and an empty `items` array — that is a normal answer,
