            tool call, refined from their original prompt. Used for audit
            logging.
        sessionId:
          type: integer
          description: The session ID
        commandId:
          type: integer
          description: >-
            Narrow the results to one command (step) of the session. Omit for
            the whole session.
        limit:
          type: integer
          description: Maximum number of items to return (default 10, max 20)
          default: 10
        offset:
          type: integer
          description: Item offset for pagination
          default: 0
      required:
        - userIntent
        - sessionId

  - name: listBlockerValidations
    title: List Blocker Validations
    description: >
      List the blockers hit while a saved test case was replayed in this session —
      steps the run could not get past, newest first, with the step, the execution
      it belonged to and whether it has been resolved. Each item's id can be passed
      to the blocker detail endpoint for screens and elements. Reach for this when
      the user asks "what blocked the run", "stuck step" or "blockers" for a
      session.
      Results are paged: each call returns at most `limit` items (default 10,
      max 20) plus `page`, `total_pages` and `total_items`; pass `offset` to
      page forward. A session with no findings of this type returns
      `total_items: 0` and an empty `items` array — that is a normal answer,
      not an error.
    annotations:
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false
    inputSchema:
      type: object
      properties:
        userIntent:
          type: string
          description: >-
            A brief summary of what the user is trying to accomplish with this
            tool call, refined from their original prompt. Used for audit
            logging.
        sessionId:
          type: integer
          description: The session ID
        limit:
          type: integer
          description: Maximum number of items to return (default 10, max 20)
          default: 10
        offset:
          type: integer
          description: Item offset for pagination
          default: 0
      required:
        - userIntent
        - sessionId

  - name: listElementSelectionValidations
    title: List Element Selection Validations
    description: >
      List the element-selection validations of a test session — steps where the
      target element resolved to a different element than the one recorded, with
      the recorded screens, target element, action type and action data. Reach for
      this when the user asks about "wrong element", "locator", "element mismatch"
      or "element selection" in a session.
      Results are paged: each call returns at most `limit` items (default 10,
      max 20) plus `page`, `total_pages` and `total_items`; pass `offset` to
      page forward. A session with no findings of this type returns
      `total_items: 0` and an empty `items` array — that is a normal answer,
      not an error.
    annotations:
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false
    inputSchema:
      type: object
      properties:
        userIntent:
          type: string
          description: >-
            A brief summary of what the user is trying to accomplish with this
